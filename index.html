<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>번개 다람쥐</title>
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a1420; color:#fff; touch-action:none; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #app { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:6px 8px calc(8px + env(safe-area-inset-bottom)); }
  #wrap { position:relative; flex:0 0 auto; }
  canvas { display:block; border-radius:10px; background:#000; box-shadow:0 0 0 2px #1d3a5a, 0 8px 24px rgba(0,0,0,.5); image-rendering:auto; }
  #top { position:absolute; right:6px; top:6px; display:flex; gap:6px; }
  #top button { width:30px; height:30px; border-radius:8px; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.5); color:#fff; font-size:13px; }
  /* 오버레이 */
  #overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:10px; text-align:center; padding:16px; background:rgba(6,14,28,.95); overflow:auto; }
  #overlay > :first-child { margin-top:auto; } #overlay > :last-child { margin-bottom:auto; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:34px; font-weight:900; color:#ffb83a; text-shadow:0 3px 0 #7a3a00, 0 0 16px #ff8a2a66; line-height:1.1; }
  #overlay h2 { font-size:22px; font-weight:900; }
  #overlay p { font-size:13px; color:#cfe0f5; line-height:1.5; max-width:320px; }
  #overlay p b { color:#ffe27a; }
  #overlay .big { font-size:18px; font-weight:900; color:#ffe27a; }
  .btn { background:linear-gradient(180deg,#ffe27a,#f08a1a); color:#3a1a00; font-weight:900; font-size:16px; border:none; border-radius:999px; padding:10px 28px; box-shadow:0 3px 0 #8a4400; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 0 #8a4400; }
  .sub { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:13px; font-weight:700; border-radius:999px; padding:7px 16px; cursor:pointer; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #zones { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:100%; max-width:330px; }
  #zones button { border:none; border-radius:10px; padding:6px 2px; background:#16304f; color:#fff; font-weight:800; font-size:15px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); display:flex; flex-direction:column; align-items:center; gap:1px; }
  #zones button small { font-size:9px; font-weight:600; color:#9ac0e8; }
  #zones button.cur { box-shadow:inset 0 0 0 2px #ffe27a; }
  #zones button:disabled { opacity:.35; }
  /* 폰 조작판: 왼쪽 조이스틱 칸, 오른쪽 큰 점프 버튼 */
  #controls { display:none; width:100%; max-width:560px; justify-content:space-between; align-items:center; gap:12px; padding:0 8px; }
  #stick { position:relative; width:190px; height:104px; border-radius:22px; border:2px dashed rgba(255,255,255,.22); background:rgba(255,255,255,.05); overflow:hidden; touch-action:none; }
  #stickBase { position:absolute; left:0; top:0; width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); pointer-events:none; opacity:0; transform:translate(66px,24px); }
  #stickBase.on { opacity:1; }
  #stickKnob { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:rgba(255,255,255,.6); }
  #stickHint { position:absolute; inset:0; padding-top:26px; text-align:center; color:rgba(255,255,255,.4); font-size:12px; font-weight:800; line-height:1.4; pointer-events:none; }
  #stickHint small { font-size:10px; font-weight:600; }
  #jumpBtn { width:104px; height:104px; border-radius:50%; border:3px solid rgba(255,170,100,.6); background:rgba(255,106,58,.35); color:#fff; font-size:20px; font-weight:900; touch-action:none; }
  #jumpBtn.on { background:rgba(255,210,58,.55); transform:scale(.95); }
  @media (pointer:coarse) { #controls { display:flex; } }
  @media (pointer:coarse) and (orientation:landscape) {
    /* 가로 화면: 게임 화면이 가운데 전체를 쓰고, 조이스틱 칸과 점프 버튼은 양쪽 아래에 반투명으로 겹쳐 놓는다 */
    #app { padding:4px 8px; }
    #controls { position:absolute; left:0; right:0; bottom:0; max-width:none; padding:0 14px calc(8px + env(safe-area-inset-bottom)); pointer-events:none; }
    #controls > * { pointer-events:auto; opacity:.72; }
    #stick { width:150px; height:96px; }
    #jumpBtn { width:92px; height:92px; }
  }
  .pc { display:none; } @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="c" width="320" height="200"></canvas>
    <div id="top"><button id="muteBtn" title="소리 (M)">🔊</button><button id="pauseBtn" title="일시정지 (P)">⏸</button></div>
    <div id="overlay">
      <h1>⚡ 번개 다람쥐</h1>
      <p>언덕을 <b>달려 내려가며 점점 빨라지고</b>, 링을 모으고, 적은 <b>몸을 말아 부수고</b>, 구멍은 뛰어 넘어 <b>골</b>까지!</p>
      <button class="btn" id="btnStart">시작하기</button>
      <div id="zoneBox"><p style="margin-bottom:5px">코스 고르기</p><div id="zones"></div></div>
      <p class="help" style="font-size:11px;color:#9ab5d8"><span class="pc">← → 달리기 · ↓ 몸 말기(구르기) · 스페이스 점프(오래 누르면 높이) · 서서 ↓ 누른 채 스페이스 연타 후 ↓ 놓기 = 스핀 대시 · P 일시정지</span><span class="touch">왼쪽 칸에서 좌우로 밀면 달리기 · 아래로 밀면 구르기 · 오른쪽 큰 버튼으로 점프 · 서서 아래로 민 채 점프 버튼을 눌러 힘을 모으고 놓으면 스핀 대시</span></p>
    </div>
  </div>
  <div id="controls">
    <div id="stick"><div id="stickBase"><div id="stickKnob"></div></div><span id="stickHint">◀ 밀어서 달리기 ▶<br><small>아래로 밀면 구르기</small></span></div>
    <button id="jumpBtn">점프</button>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
